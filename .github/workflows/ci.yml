name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"     # same uv that writes uv.lock locally
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run poe lint

      - name: Formatting
        run: uv run poe format-check

      - name: Type check
        run: uv run poe typecheck

      # Tests run on synthetic data, so CI needs no dataset or Kaggle credentials
      - name: Tests (coverage gate 90%)
        run: uv run poe cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Build ${{ matrix.image }} image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        image: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          load: true
          tags: credit-scoring-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke test (UI starts and reports healthy)
        if: matrix.image == 'ui'
        run: |
          docker run -d --name ui -p 8501:8501 credit-scoring-ui:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs ui
          exit 1
      - name: Smoke test (API image imports the service)
        if: matrix.image == 'api'
        run: docker run --rm --entrypoint python credit-scoring-api:ci -c "import credit_scoring.api.main"
