# Full stack: scoring API + web UI.
#   uv run poe train            # produce models/credit_model.joblib first
#   docker compose up --build
#   UI   http://localhost:8501
#   API  http://localhost:8000/docs

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: credit-scoring-api:latest
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro       # model artefacts, read-only
      - ./logs:/app/logs              # prediction log, for drift monitoring
    restart: unless-stopped
    read_only: true                   # immutable container; only the mounts are writable
    tmpfs:
      - /tmp

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    image: credit-scoring-ui:latest
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      CREDIT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
